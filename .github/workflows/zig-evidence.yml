name: Zig executable evidence
on:
  pull_request:
    paths:
      - 'samples/12_c_extensions/**'
      - '.github/workflows/zig-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'samples/12_c_extensions/**'
      - '.github/workflows/zig-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zig-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    name: Executable evidence (${{ matrix.runner }}, ${{ matrix.cpu }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cpu: baseline
            archive: x86_64-linux
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - runner: ubuntu-24.04
            cpu: native
            archive: x86_64-linux
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - runner: ubuntu-24.04-arm
            cpu: native
            archive: aarch64-linux
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Zig
        shell: bash
        env:
          ZIG_ARCHIVE: ${{ matrix.archive }}
          ZIG_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://ziglang.org/download/0.16.0/zig-$ZIG_ARCHIVE-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-$ZIG_ARCHIVE-0.16.0" >> "$GITHUB_PATH"
      - name: Execute long-input parity, allocator calibration and source mutations
        shell: bash
        env:
          ZIG_CPU: ${{ matrix.cpu }}
        working-directory: samples/12_c_extensions/12_zig_suite
        run: |
          set -euo pipefail
          python tools/mutations.py --cpu "$ZIG_CPU" 2>&1 | tee "$RUNNER_TEMP/evidence.log"
          {
            echo '## Executable evidence'
            echo "Tested commit: $GITHUB_SHA"
            echo '```text'
            cat "$RUNNER_TEMP/evidence.log"
            echo '```'
            echo 'Finite differential tests and four source mutants; not formal proof, proprietary SDK validation, or universal allocator interception.'
          } >> "$GITHUB_STEP_SUMMARY"
