name: C Zig and Odin matched competition
on:
  pull_request:
    paths: ['samples/12_c_extensions/**', '.github/workflows/zig-rivals.yml']
  push:
    branches: [main]
    paths: ['samples/12_c_extensions/**', '.github/workflows/zig-rivals.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zig-rivals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rivals:
    name: Matched rivals (${{ matrix.runner }}, ${{ matrix.cpu }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, cpu: baseline, archive: x86_64-linux, sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00, odin_archive: odin-linux-amd64-dev-2026-09.tar.gz, odin_sha256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283}
          - {runner: ubuntu-24.04, cpu: native, archive: x86_64-linux, sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00, odin_archive: odin-linux-amd64-dev-2026-09.tar.gz, odin_sha256: 167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283}
          - {runner: ubuntu-24.04-arm, cpu: native, archive: aarch64-linux, sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17, odin_archive: odin-linux-arm64-dev-2026-09.tar.gz, odin_sha256: c150c6f2d13668f3a1c4116ef96ea85c1ba1c9ededfd76081cd3c7d4ba92aa91}
    defaults:
      run: {shell: bash, working-directory: samples/12_c_extensions/12_zig_suite/competition}
    env: {ZIG_CPU: '${{ matrix.cpu }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install checksum-pinned Zig and Odin
        env: {ARCHIVE: '${{ matrix.archive }}', SHA256: '${{ matrix.sha256 }}', ODIN_ARCHIVE: '${{ matrix.odin_archive }}', ODIN_SHA256: '${{ matrix.odin_sha256 }}'}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rivals" "$RUNNER_TEMP/odin-release"
          curl --fail --location --retry 3 "https://ziglang.org/download/0.16.0/zig-$ARCHIVE-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"; echo "$RUNNER_TEMP/zig-$ARCHIVE-0.16.0" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "https://github.com/odin-lang/Odin/releases/download/dev-2026-09/$ODIN_ARCHIVE" -o "$RUNNER_TEMP/odin.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin-release"
          ODIN_BIN="$(find "$RUNNER_TEMP/odin-release" -type f -name odin -perm -111 -print -quit)"; test -n "$ODIN_BIN"; echo "$(dirname "$ODIN_BIN")" >> "$GITHUB_PATH"; "$ODIN_BIN" version | tee "$RUNNER_TEMP/rivals/odin-version.txt"
      - name: Build pinned Odin competitor
        run: |
          python3 build_odin.py --cpu "$ZIG_CPU" 2>&1 | tee "$RUNNER_TEMP/rivals/odin-build.log"
          cp odin-out/build.json "$RUNNER_TEMP/rivals/odin-build.json"
      - name: Measure direct per-source compile cost
        run: python3 build_metrics.py --cpu "$ZIG_CPU" --output "$RUNNER_TEMP/rivals/build-metrics.json" | tee "$RUNNER_TEMP/rivals/build-metrics.stdout"
      - name: Check semantics bounds and report arithmetic
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../tools -p test_measure.py -v
          python3 test_report.py -v
          for mode in Debug ReleaseSafe ReleaseFast; do zig build test -Doptimize="$mode" -Dcpu="$ZIG_CPU" --summary all 2>&1 | tee "$RUNNER_TEMP/rivals/test-$mode.log"; done
      - name: Require compiled C Zig and Odin source mutants to fail correctly
        run: python3 mutations.py --cpu "$ZIG_CPU" 2>&1 | tee "$RUNNER_TEMP/rivals/mutations.log"
      - name: Measure all contenders baselines and allocator traffic
        run: |
          python3 run.py --cpu "$ZIG_CPU" --output "$RUNNER_TEMP/rivals"
          cat "$RUNNER_TEMP/rivals/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Sweep every short newline length before choosing a dispatcher
        run: |
          ./zig-out/bin/lf-sweep > "$RUNNER_TEMP/rivals/lf-sweep.jsonl"
          python3 lf_sweep.py "$RUNNER_TEMP/rivals/lf-sweep.jsonl" "$RUNNER_TEMP/rivals" | tee "$RUNNER_TEMP/rivals/lf-sweep.stdout"
          cat "$RUNNER_TEMP/rivals/lf-sweep-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw results code sizes and disassembly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'rivals-${{ matrix.runner }}-${{ matrix.cpu }}', path: '${{ runner.temp }}/rivals', if-no-files-found: error, retention-days: 30}
  pareto:
    name: Multi-objective Pareto frontier
    needs: rivals
    if: ${{ !cancelled() && needs.rivals.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'rivals-*', path: '${{ runner.temp }}/pareto-input'}
      - name: Build Pareto frontiers without a fake weighted score
        working-directory: samples/12_c_extensions/12_zig_suite/competition
        run: |
          set -euo pipefail
          python3 pareto.py "$RUNNER_TEMP/pareto-input" "$RUNNER_TEMP/pareto" | tee "$RUNNER_TEMP/pareto/stdout.md"
          cat "$RUNNER_TEMP/pareto/pareto.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: rivals-pareto-frontier, path: '${{ runner.temp }}/pareto', if-no-files-found: error, retention-days: 30}
