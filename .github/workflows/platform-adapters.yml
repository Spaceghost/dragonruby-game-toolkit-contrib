name: Native platform adapter evidence
on:
  pull_request:
    paths: ['samples/12_c_extensions/12_zig_suite/platform/**','samples/12_c_extensions/12_zig_suite/src/worker_wait*','.github/workflows/platform-adapters.yml']
  push:
    branches: [main]
    paths: ['samples/12_c_extensions/12_zig_suite/platform/**','samples/12_c_extensions/12_zig_suite/src/worker_wait*','.github/workflows/platform-adapters.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'platform-adapters-${{ github.event.pull_request.number || github.ref }}', cancel-in-progress: true}
jobs:
  linux-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Install pinned Zig Odin and SDL2 headers
        run: |
          set -euo pipefail
          sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends libsdl2-dev
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"; echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  '"$RUNNER_TEMP/zig.tar.xz" | sha256sum --check; tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"; echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 https://github.com/odin-lang/Odin/releases/download/dev-2026-09/odin-linux-amd64-dev-2026-09.tar.gz -o "$RUNNER_TEMP/odin.tar.gz"; echo '167c3e1d7056419dad2e04bb3bd98715b7ff286d4c125f3c5a5ee337c6254283  '"$RUNNER_TEMP/odin.tar.gz" | sha256sum --check; mkdir -p "$RUNNER_TEMP/odin"; tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"; ODIN_BIN=$(find "$RUNNER_TEMP/odin" -type f -name odin -perm -111 -print -quit); echo "$(dirname "$ODIN_BIN")" >> "$GITHUB_PATH"
      - name: Build Odin and execute real SDL wait wake lifecycle
        working-directory: samples/12_c_extensions/12_zig_suite
        run: |
          mkdir -p "$RUNNER_TEMP/platform"; python3 competition/build_odin.py --cpu native; (cd platform && zig build test -Doptimize=ReleaseFast -Dcpu=native -Dodin-object=../competition/odin-out/competitive.o --summary all) 2>&1 | tee "$RUNNER_TEMP/platform/sdl.log"; grep '^SDL_WAIT_PROOF ' "$RUNNER_TEMP/platform/sdl.log"
      - name: Execute JNI lifecycle against a real host JVM
        working-directory: samples/12_c_extensions/12_zig_suite
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" platform/jni_adapter.c platform/jni_adapter_test.c -L"$JAVA_HOME/lib/server" -Wl,-rpath,"$JAVA_HOME/lib/server" -ljvm -pthread -o "$RUNNER_TEMP/jni-test"; "$RUNNER_TEMP/jni-test" | tee "$RUNNER_TEMP/platform/jni.log"
      - name: Cross-compile JNI adapter with hosted Android NDK
        working-directory: samples/12_c_extensions/12_zig_suite
        run: |
          test -n "${ANDROID_NDK_ROOT:-}"; tool="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"; test -x "$tool"; "$tool" -std=c11 -Wall -Wextra -Werror -fPIC -c platform/jni_adapter.c -o "$RUNNER_TEMP/platform/jni-android-arm64.o"; file "$RUNNER_TEMP/platform/jni-android-arm64.o" | tee "$RUNNER_TEMP/platform/jni-android.log"
      - name: Validate Steamworks wrapper with explicit test-only SDK stub
        working-directory: samples/12_c_extensions/12_zig_suite
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iplatform/stubs platform/steamworks_adapter.cpp platform/steamworks_adapter_test.cpp -o "$RUNNER_TEMP/steam-test"; "$RUNNER_TEMP/steam-test" | tee "$RUNNER_TEMP/platform/steam-stub.log"; echo 'Real Steamworks SDK/runtime remains a separate gated build.' >> "$RUNNER_TEMP/platform/steam-stub.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: platform-adapter-evidence, path: '${{ runner.temp }}/platform', if-no-files-found: warn, retention-days: 30}
