name: Clang versus zig-cc matrix

on:
  pull_request:
    paths:
      - 'samples/12_c_extensions/12_zig_suite/**'
      - 'samples/12_c_extensions/01_basics/**'
      - 'samples/12_c_extensions/02_intermediate/**'
      - 'samples/12_c_extensions/03_native_pixel_arrays/**'
      - 'samples/12_c_extensions/04_handcrafted_extension_advanced/**'
      - '.github/workflows/zig-cc-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'samples/12_c_extensions/12_zig_suite/**'
      - '.github/workflows/zig-cc-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zig-cc-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler-matrix:
    name: C compilers (${{ matrix.os }}, ${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            archive: x86_64-linux
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            cpu: baseline
          - os: ubuntu-24.04
            archive: x86_64-linux
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            cpu: native
          - os: ubuntu-24.04-arm
            archive: aarch64-linux
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            cpu: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Zig
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://ziglang.org/download/0.16.0/zig-${{ matrix.archive }}-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-${{ matrix.archive }}-0.16.0" >> "$GITHUB_PATH"
      - name: Compile and interleave all C profiles
        working-directory: samples/12_c_extensions/12_zig_suite/compiler_matrix
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compiler-matrix"
          mkdir -p "$out"
          clang --version | tee "$out/host-clang.txt"
          zig cc --version | tee "$out/zig-cc.txt"
          python3 run.py --cpu '${{ matrix.cpu }}' --output "$out" --min-ns 2000000 | tee "$out/stdout-report.md"
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$out"/raw.jsonl "$out"/summary.json "$out"/builds.json "$out"/environment.json > "$out/SHA256SUMS.txt"
      - name: Retain compiler matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-matrix-${{ matrix.os }}-${{ matrix.cpu }}
          path: ${{ runner.temp }}/compiler-matrix
          if-no-files-found: warn
          retention-days: 30
