name: Zig mruby integration

on:
  push:
    branches: [main]
    paths:
      - samples/12_c_extensions/11_zig_native_pixel_arrays/**
      - .github/workflows/zig-mruby.yml
  pull_request:
    paths:
      - samples/12_c_extensions/11_zig_native_pixel_arrays/**
      - .github/workflows/zig-mruby.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: zig-mruby-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Real mruby (${{ matrix.boxing }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        boxing: [word, nan, none]
    env:
      MRUBY_BOXING: ${{ matrix.boxing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mruby/mruby
          ref: a309524d0bc90eef077a24634db2495a6f68e318 # 3.4.0, test host only
          path: .ci-mruby
          submodules: recursive
          persist-credentials: false
      - name: Install checksum-pinned Zig
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build the real mruby host
        shell: bash
        run: |
          export MRUBY_CONFIG="$GITHUB_WORKSPACE/samples/12_c_extensions/11_zig_native_pixel_arrays/tests/mruby_config.rb"
          cd .ci-mruby
          if rake -j2 > "$RUNNER_TEMP/mruby-build.log" 2>&1; then
            echo 'mruby build passed'
          else
            result=$?
            tail -n 40 "$RUNNER_TEMP/mruby-build.log"
            exit "$result"
          fi
      - name: Load and exercise the actual bridge and Zig library
        working-directory: samples/12_c_extensions/11_zig_native_pixel_arrays
        shell: bash
        run: |
          for mode in Debug ReleaseSafe; do
            if zig build mruby-test -Doptimize="$mode" -Dcpu=baseline \
              -Dmruby-root="$GITHUB_WORKSPACE/.ci-mruby" -Dmruby-boxing="$MRUBY_BOXING" --summary all \
              > "$RUNNER_TEMP/mruby-$mode.log" 2>&1; then
              tail -n 15 "$RUNNER_TEMP/mruby-$mode.log"
            else
              result=$?
              tail -n 50 "$RUNNER_TEMP/mruby-$mode.log"
              exit "$result"
            fi
          done
      - name: Record scope
        if: always()
        shell: bash
        run: |
          echo 'Real mruby exercises the shared Ruby smoke suite through app/bridge.c and Zig; consult job results for pass/fail.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The host table/upload sink is a test contract, NOT DragonRuby SDK ABI or GPU validation.' >> "$GITHUB_STEP_SUMMARY"
