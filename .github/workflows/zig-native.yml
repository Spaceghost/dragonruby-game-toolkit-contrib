name: Zig native extensions

on:
  push:
    paths:
      - samples/12_c_extensions/11_zig_native_pixel_arrays/**
      - .github/workflows/zig-native.yml
  pull_request:
    paths:
      - samples/12_c_extensions/11_zig_native_pixel_arrays/**
      - .github/workflows/zig-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: samples/12_c_extensions/11_zig_native_pixel_arrays
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Zig
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Formatting and script syntax
        run: |
          zig fmt --check build.zig app
          sh -n pre.sh
          ruby -c app/main.rb
          ruby -c tests/smoke.rb
      - name: Debug unit and C ABI tests
        run: zig build test -Doptimize=Debug --summary all
      - name: ReleaseSafe unit and C ABI tests
        run: zig build test -Doptimize=ReleaseSafe -Dcpu=baseline --summary all
      - name: Compile-only cross-target checks (no DragonRuby SDK)
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-linux-gnu x86_64-windows-gnu aarch64-macos x86_64-macos; do
            zig build check -Dtarget="$target" -Doptimize=ReleaseSafe -Dcpu=baseline --summary all
          done
